<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>గుర్రం జాషువా</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            display:flex;
            align-items:center;
            gap:50px;
            background:white;
            padding:30px 40px;
            border-radius:12px;
            box-shadow:0 6px 18px rgba(0,0,0,0.2);
            text-decoration:none;
            color:black;
            max-width:900px;
        }

        .text{
            line-height:1.8;
            font-size:20px;
        }

        .text h2{
            margin-bottom:15px;
            color:#1b3c88;
        }

        img{
            width:260px;
            border-radius:10px;
        }
    </style>
</head>

<body>

<a href="sobhana.jpg" target="_blank" class="card">

    <div class="text">
        <h2>గుర్రం జాషువా</h2>

        <p>స్వస్థలం - వినుకొండ</p>

        <p>
        బిరుదులు - కవి కోకిల, కవితా విశారద, నవయుగ చక్రవర్తి
        </p>

        <p>
        అవార్డులు - కళా ప్రపూర్ణ, పద్మభూషణ్, కేంద్ర సాహిత్య అకాడమీ
        </p>

        <p>
        రచనలు - పిరదోసి, గబ్బిలము, కొత్త లోకం
        </p>

        <br>
        <b>K Sobhana Sulabhagathi</b>
    </div>

    <img src="sobhana.jpg" alt="Sobhana">

</a>

</body>
</html>
