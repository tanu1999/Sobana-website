<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sobhana Sulabhagathi</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            padding:40px;
        }

        .card{
            display:flex;
            align-items:center;
            gap:40px;
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            max-width:900px;
            text-decoration:none;
            color:black;
        }

        .text{
            text-align:left;
            line-height:1.6;
            font-size:20px;
        }

        .text h2{
            color:#1b3c88;
            margin-bottom:15px;
        }

        img{
            width:260px;
            border-radius:10px;
        }

        .card:hover{
            transform:scale(1.02);
            transition:0.2s;
        }
    </style>
</head>

<body>

<a href="sobhana.jpg" target="_blank" class="card">

    <!-- Left side Telugu text -->
    <div class="text">
        <h2>గుడిపాటి జ్ఞానమా (1895–1971)</h2>

        <p>వేషభూషణం – వేదికుకింద</p>

        <p>
        బిరుదులు – కవికోకిల, కవితా విశారద, నవయుగ కవిచక్రవర్తి<br>
        అవార్డులు – కళాప్రపూర్ణ, పద్మ భూషణ్, కేంద్ర సాహిత్య అకాడమీ<br>
        రచనలు – పరిశోధన, గద్యరచనలు, కవిత్వం
        </p>

        <p><b>Click anywhere to view full image</b></p>
    </div>

    <!-- Right side image -->
    <img src="sobhana.jpg" alt="Sobhana">

</a>

</body>
</html>
